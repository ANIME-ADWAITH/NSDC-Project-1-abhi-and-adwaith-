<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Coders</title>

  <style>
    .family-gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 1000px;
  margin: 20px auto 40px;
  padding: 0 24px;
}

.family-gallery img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
}

@media (max-width: 600px) {
  .family-gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 14px;
  }
}
    footer {
  margin-top: 40px;
  padding: 24px;
  background: #202127;
  border-top: 1px solid #383940;
}

.foot ul {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.foot a {
  display: block;
  padding: 9px 13px;
  color: #ccc;
  background: #2b2c34;
  border-radius: 5px;
  font-size: 14px;
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
}

.foot a:hover {
  color: #fff;
  background: #0878cf;
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 24px;
      background: #202127;
    }

    .left-side {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    header h3 {
      margin: 0;
      color: #fff;
      font-size: 20px;
      white-space: nowrap;
    }

    .search {
      display: flex;
      width: 280px;
    }

    .search input {
      min-width: 0;
      flex: 1;
      padding: 9px 12px;
      color: #fff;
      background: #303139;
      border: 1px solid #484952;
      border-right: 0;
      border-radius: 5px 0 0 5px;
      outline: none;
    }

    .search input:focus {
      border-color: #1688e8;
    }

    .search button {
      padding: 0 14px;
      color: #fff;
      background: #0878cf;
      border: 0;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav a {
      color: #ddd;
      font-size: 14px;
      text-decoration: none;
    }

    .nav a:hover {
      color: #55adf5;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 30px;
    }

    .hero img {
      width: 360px;
      max-width: 45%;
      height: auto;
    }

    .title {
      margin: 0;
      color: #222;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 5px;
    }

    .first-letter {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero-text p {
      margin-top: 10px;
      color: #555;
    }

    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
      }

      .left-side {
        flex-wrap: wrap;
      }

      .nav {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (max-width: 600px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="left-side">
      <h3>Alpha Coders</h3>

      <form class="search">
        <input type="search" placeholder="Search wallpapers">
        <button type="submit">Search</button>
      </form>
    </div>

    <nav class="nav">
      <a href="About Us.html">About Us</a>
      <a href="Login.html">Login</a>
      <a href="#">Register</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <img
        src="https://static.alphacoders.com/alpha-system-fall-v2-360.png"
        alt="Alpha Coders artwork"
      >

      <div class="hero-text">
        <h1 class="title">
          <span class="first-letter">A</span>LPHA
          <span class="first-letter">C</span>ODERS
        </h1>

        <p>Content Creators, Curators, and Fans - United!</p>
      </div>
    </section>
  </main>
  <h1>The Alpha Coders Family</h1>

  <div class="family-gallery">
  <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape">
  <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=800&q=80" alt="Colorful nebula in space">
  <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=80" alt="Starry night sky">
  <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain lake">
  <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80" alt="Ocean waves">
  <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Sunrise over a field">
  <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80" alt="Sunlight through a forest">
  <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Tropical beach">
  <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="Misty hills">
</div>
