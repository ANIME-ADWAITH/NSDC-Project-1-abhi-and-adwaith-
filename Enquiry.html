
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background-color: #f0ebf8;
            font-family: Arial, sans-serif;
        }

        form {
            max-width: 650px;
            margin: auto;
        }

        .box {
            background-color: rgb(218,202,181);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ddd;
        }

        #b1 {
            border-top: 10px solid rgb(218,202,181);
        }

        #b2 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 2px solid #888;
            background-color: transparent;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus {
            border-bottom: 2px solid #795548;
        }

        textarea {
            resize: vertical;
        }

        button {
            background-color: rgb(218,202,181);
            color: black;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #c8b69e;
        }
    </style>
</head>

<body>

<form action="" method="GET">

    <div class="box" id="b1">
        <h1>Enquiry Form</h1>
        <p>Please fill out the form below to send your enquiry.</p>
        <p>* Indicates required question</p>
    </div>

    <div class="box" id="b2">
        <label for="name">Full Name *</label>
        <input type="text" name="name" id="name"
        placeholder="Your answer" required>
    </div>

    <div class="box" id="b3">
        <label for="email">Email Address *</label>
        <input type="email" name="email" id="email"
        placeholder="Your answer" required>
    </div>

    <div class="box" id="b4">
        <label for="phone">Phone Number</label>
        <input type="tel" name="phone" id="phone"
        placeholder="Your answer">
    </div>

    <div class="box" id="b5">
        <label for="subject">Enquiry Subject*</label>
        <select name="subject" id="subject" required>
            <option value="" disabled selected>Select an option</option>
            <option value="download issue">Wallpaper Download Issue</option>
            <option value="Quality issue">Wallpaper Quality or Resolution</option>
            <option value="copyright">Copyright or Image Permission</option>
            <option value="feedback">Feedback or Suggestions</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div class="box" id="b6">
        <label for="message">Your Message *</label>
        <textarea name="message" id="message"
        rows="4" placeholder="Your answer" required></textarea>
    </div>

    <button type="submit">Submit</button>

</form>

</body>
</html>
